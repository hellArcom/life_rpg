name: Release signed APKs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # F-Droid extracts the Flutter revision from the "flutter-version" entry
      # below (templates/build-flutter.yml). Keep this value in single quotes.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - name: Install pinned NDK
        shell: bash
        run: sdkmanager --install 'ndk;28.2.13676358'

      - name: Set up signing key
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_KEYSTORE_PASSWORD" ] \
             || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Missing release signing secrets. Create a keystore, keep it safe,"
            echo "and set these repository secrets: SIGNING_KEYSTORE (base64 of the"
            echo ".jks), SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | base64 --decode > /tmp/release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$SIGNING_KEYSTORE_PASSWORD
          keyPassword=$SIGNING_KEY_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          storeFile=/tmp/release-key.jks
          EOF

      # Build in the same absolute path as F-Droid so the APKs are
      # byte-for-byte reproducible (see templates/build-flutter.yml).
      - name: Move to reproducible build path
        shell: bash
        run: |
          sudo mkdir -p /upstream/path/github.com/hellArcom
          sudo mv "$GITHUB_WORKSPACE" /upstream/path/github.com/hellArcom/life_rpg
          sudo chown -R "$USER":"$USER" /upstream/path

      - name: Build signed APKs (split per ABI)
        shell: bash
        working-directory: /upstream/path/github.com/hellArcom/life_rpg
        run: |
          set -eu
          rm -rf ios linux windows
          export PUB_CACHE="$PWD/.pub-cache"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          # One invocation per ABI, exactly like F-Droid does.
          flutter build apk --release --split-per-abi --target-platform="android-arm"
          flutter build apk --release --split-per-abi --target-platform="android-arm64"
          flutter build apk --release --split-per-abi --target-platform="android-x64"

      - name: Stage release assets
        shell: bash
        working-directory: /upstream/path/github.com/hellArcom/life_rpg
        run: |
          set -eu
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "artifacts/life_rpg-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "artifacts/life_rpg-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "artifacts/life_rpg-x86_64.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        working-directory: /upstream/path/github.com/hellArcom/life_rpg
        with:
          files: /upstream/path/github.com/hellArcom/life_rpg/artifacts/*.apk
          generate_release_notes: true