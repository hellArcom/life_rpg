AutoName: Life RPG

RepoType: git
Repo: https://github.com/hellArcom/life_rpg.git

Builds:
  - versionName: 0.5.1
    versionCode: 21
    commit: 7133f0077eb9cec343582cbd10acefbecdff10fe
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - windows
      - macos
      - web
    prebuild:
      - flutterVersion=3.44.9
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - find $$flutter$$ -type f -name "*.gradle*" -exec sed -i '/com.google.android.play/d' {} +
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - find .pub-cache -type d -name "example" -exec rm -rf {} +
      - find .pub-cache -type d -name "devtools" -exec rm -rf {} +
      - find .pub-cache -type d -name "_out" -exec rm -rf {} +
      - find .pub-cache -type d -name "extension" -exec rm -rf {} +
      - find .pub-cache -type f -name "build.gradle*" -exec sed -i '/com.google.android.play/d' {} +
      - find .pub-cache -type f -name "*.bin" -delete
      - find .pub-cache -type f -name "*.wasm" -delete
      - find .pub-cache -type f -name "*.zip" -delete
      - find .pub-cache -type f -name "*.gz" -delete
      - find .pub-cache -type f -name "*.tgz" -delete
      - find .pub-cache -type f -name "*.ttf" -delete
      - find .pub-cache -type f -name "*.png" -delete
      - find .pub-cache -type f -name "*.jpg" -delete
      - find .pub-cache -type f -name "*.jpeg" -delete
      - find .pub-cache -type f -name "*.gif" -delete
      - find .pub-cache -type f -path "*/example/*" -delete
      - find .pub-cache -type f -path "*/devtools/*" -delete
      - find .pub-cache -type f -path "*/extension/*" -delete
      - find .pub-cache -type f -name "*.class" -path "*/com/google/android/play/*" -delete
      - find .pub-cache -type f -name "*.jar" -path "*/play/*" -delete
      - find .pub-cache -type f -path "*/play/core/*" -delete
      - find .pub-cache -type f -name "*.class" -path "*/com/google/android/play/core/*" -delete
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define=FDROID_BUILD=true --split-per-abi --target-platform="android-arm"

