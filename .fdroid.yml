# Signed per-ABI APKs are published on GitHub Releases (see
# .github/workflows/release.yml) and used by F-Droid to verify the
# reproducible build via the "binary:" entries above. The SHA-256 digest of
# the release signing certificate (PKCS12 keystore, kept offline/backed up):
AllowedAPKSigningKeys:
  - d7da0aaf54f83d2723baa1ac4f007ac1f1eafe18a9744b3289d538b4383b91fb

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - 10 * %c + 1
  - 10 * %c + 2
  - 10 * %c + 3
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.4.0
CurrentVersionCode: 1