# F-Droid build recipe for Life RPG.
# commit: targets the v0.4.0 tag = 05f8f4d (contains the pinned Flutter release
#          workflow and the reproducible build path setup).
# Flutter version is pinned in the app repo (.github/workflows/release.yml)
# and checked out here via srclib, see templates/build-flutter.yml#L36-L38.
# ABI version code scheme (android/app/build.gradle.kts):
#   versionCode = base * 10 + abi   armeabi-v7a=1, arm64-v8a=2, x86_64=3
#   mirrored below with VercodeOperation.

Categories:
  - Habit Tracker
  - Role-Playing Game
License: GPL-3.0-only
AuthorName: hellArcom
SourceCode: https://github.com/hellArcom/life_rpg
IssueTracker: https://github.com/hellArcom/life_rpg/issues
Changelog: https://github.com/hellArcom/life_rpg/releases

AutoName: Life RPG

RepoType: git
Repo: https://github.com/hellArcom/life_rpg.git

Builds:
  - versionName: 0.4.0
    versionCode: 1
    commit: 05f8f4d2b3a9461d890290fb75f1d9cf2c7335ef
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - windows
    sudo:
      - mkdir -p /upstream/path/github.com/hellArcom
      - chown -R vagrant /upstream/path
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/upstream/path/github.com/hellArcom/life_rpg
      - cd ..
      - mv com.arcom.life_rpg $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - mv $repo com.arcom.life_rpg
    scanignore:
      - $$flutter$$/bin/cache
    scandelete:
      - .pub-cache
    build:
      - export repo=/upstream/path/github.com/hellArcom/life_rpg
      - cd ..
      - mv com.arcom.life_rpg $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - mv $repo com.arcom.life_rpg
    binary: https://github.com/hellArcom/life_rpg/releases/download/v0.4.0/life_rpg-armeabi-v7a.apk

