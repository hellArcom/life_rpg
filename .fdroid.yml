# Signed per-ABI APKs are published on GitHub Releases (see
# .github/workflows/release.yml) and used to verify the reproducible build,
# see the "binary:" entries above. Compute the fingerprint below once from a
# signed release APK (do not commit your keystore; keep it backed up offline):
#   keytool -printcert -jarfile app-release.apk | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]'
# AllowedAPKSigningKeys:

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - 10 * %c + 1
  - 10 * %c + 2
  - 10 * %c + 3
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.4.0
CurrentVersionCode: 1