AutoName: Life RPG

RepoType: git
Repo: https://github.com/hellArcom/life_rpg.git

Builds:
  - versionName: 0.5.0
    versionCode: 11
    commit: 8df4030d18ab4a320c2a9352a0347f0f4f6348b1
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - mkdir -p android/app/fdroid-tools
      - wget -q https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar -O android/app/fdroid-tools/baksmali.jar
      - wget -q https://bitbucket.org/JesusFreke/smali/downloads/smali-2.5.2.jar -O android/app/fdroid-tools/smali.jar
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - cd android && ./gradlew :app:stripPlayCoreClasses

