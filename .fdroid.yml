Changelog: https://github.com/hellArcom/life_rpg/releases

AutoName: Life RPG

RepoType: git
Repo: https://github.com/hellArcom/life_rpg.git

Builds:
  - versionName: 0.5.0
    versionCode: 11
    commit: c14077150e644e6526d4c749f08ee314ca45769f
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - windows
      - macos
      - web
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - find $$flutter$$ -type f -name "*.gradle" -exec sed -i '/com.google.android.play/d' {} +
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - find .pub-cache/ -type f -name "build.gradle*" -exec sed -i '/com.google.android.play/d' {} +
      - find .pub-cache/ -type f \( -name "*.bin" -o -name "*.wasm" \) -delete
      - echo "configurations.all { exclude group: 'com.google.android.play' }" >> android/app/build.gradle
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

